<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous nous marions! Ci sposiamo!</title>

<style>
:root{
  --bg: #faf8f4;
  --panel: #ffffff;
  --text: #232220;
  --muted: #6f6a60;
  --line: #ddd7c9;
  --accent: #52604f;
  --accent-soft: #e4e7df;
  --danger: #9c5b48;

  /* one personality color per tab */
  --c-histoire: #b5654a;   /* terracotta */
  --c-ceremonie: #55705f;  /* sage green */
  --c-reception: #8a4b6b;  /* plum */
  --c-liste: #b08a3e;      /* ochre gold */

  /* soft background tint per tab, drawn from the same colors */
  --bg-histoire: #f7ece5;
  --bg-ceremonie: #ecf1ea;
  --bg-reception: #f5eaf0;
  --bg-liste: #f9f0dd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg: #1b1a17;
    --panel: #242320;
    --text: #ece8df;
    --muted: #a8a294;
    --line: #3a382f;
    --accent: #a3b39a;
    --accent-soft: #2c3129;
    --danger: #c98f7c;

    --c-histoire: #d98a6a;
    --c-ceremonie: #8fae97;
    --c-reception: #c68bab;
    --c-liste: #d4b06a;

    --bg-histoire: #2a201b;
    --bg-ceremonie: #1e2620;
    --bg-reception: #271e25;
    --bg-liste: #2a2318;
  }
}
:root[data-theme="dark"]{
  --bg: #1b1a17;
  --panel: #242320;
  --text: #ece8df;
  --muted: #a8a294;
  --line: #3a382f;
  --accent: #a3b39a;
  --accent-soft: #2c3129;
  --danger: #c98f7c;

  --c-histoire: #d98a6a;
  --c-ceremonie: #8fae97;
  --c-reception: #c68bab;
  --c-liste: #d4b06a;

  --bg-histoire: #2a201b;
  --bg-ceremonie: #1e2620;
  --bg-reception: #271e25;
  --bg-liste: #2a2318;
}
*{ box-sizing: border-box; }
body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Times New Roman", Times, serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.5s ease;
}
body.bg-histoire{ background: var(--bg-histoire); }
body.bg-ceremonie{ background: var(--bg-ceremonie); }
body.bg-reception{ background: var(--bg-reception); }
body.bg-liste{ background: var(--bg-liste); }
.wrap{ max-width: 720px; margin: 0 auto; padding: 0 24px 80px; }
header{ padding: 40px 0 20px; }
.top-row{ display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.names{ font-size: 1.9rem; letter-spacing: 0.02em; margin: 0; }
.date-place{ margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
.lang-switch{ display: flex; gap: 8px; flex-shrink: 0; padding-top: 4px; }
.lang-switch button{
  border: 1px solid transparent; background: none; cursor: pointer;
  font-size: 1.35rem; line-height: 1; padding: 4px 6px; border-radius: 4px;
  opacity: 0.55; transition: opacity 0.15s ease, border-color 0.15s ease;
}
.lang-switch button:hover{ opacity: 0.85; }
.lang-switch button[aria-pressed="true"]{ opacity: 1; border-color: var(--line); }
.lang-switch button:focus-visible, nav button:focus-visible,
.contribute button:focus-visible, .contribute input:focus-visible,
.carousel-dots button:focus-visible{
  outline: 2px solid var(--accent); outline-offset: 2px;
}
nav{ display: flex; gap: 10px; margin-top: 26px; overflow-x: auto; }
nav button{
  background: none; border: none; font-family: inherit; font-size: 1.02rem;
  color: var(--muted); cursor: pointer; padding: 8px 16px; white-space: nowrap;
  border-radius: 999px; transition: color 0.2s ease, background-color 0.2s ease;
}
nav button[aria-selected="true"]{ font-weight: 600; }
nav button[data-tab="histoire"][aria-selected="true"]{ color: var(--c-histoire); background: color-mix(in srgb, var(--c-histoire) 16%, transparent); }
nav button[data-tab="ceremonie"][aria-selected="true"]{ color: var(--c-ceremonie); background: color-mix(in srgb, var(--c-ceremonie) 16%, transparent); }
nav button[data-tab="reception"][aria-selected="true"]{ color: var(--c-reception); background: color-mix(in srgb, var(--c-reception) 16%, transparent); }
nav button[data-tab="liste"][aria-selected="true"]{ color: var(--c-liste); background: color-mix(in srgb, var(--c-liste) 16%, transparent); }
main{ padding-top: 40px; }
section{ display: none; }
section.active{ display: block; }
section h2{ font-size: 1.5rem; font-weight: normal; margin: 0 0 20px; }
#histoire h2{ color: var(--c-histoire); }
#ceremonie h2{ color: var(--c-ceremonie); }
#reception h2{ color: var(--c-reception); }
#liste h2{ color: var(--c-liste); }
section p{ margin: 0 0 16px; max-width: 62ch; }

/* photo carousel: several photos sharing one frame, fading in place */
.carousel-frame{
  position: relative; width: 100%; aspect-ratio: 4 / 3; border: 1px dashed var(--line);
  border-radius: 2px; overflow: hidden; background: var(--panel); margin: 4px 0 22px;
}
.carousel-frame.wide{ aspect-ratio: 16/9; }
.carousel-frame.square{ aspect-ratio: 1/1; margin: 0 0 14px; }
.carousel-frame .slide{ position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; }
.carousel-frame .slide.active{ opacity: 1; }
.carousel-frame .slide img{ width: 100%; height: 100%; object-fit: cover; display: block; }
.carousel-frame .slide.placeholder{ display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.95rem; text-align: center; padding: 12px; }
.carousel-dots{
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 7px; background: rgba(0,0,0,0.28); padding: 5px 9px; border-radius: 12px;
}
.carousel-dots button{
  width: 7px; height: 7px; border-radius: 50%; border: none; padding: 0; cursor: pointer;
  background: rgba(255,255,255,0.5);
}
.carousel-dots button[aria-current="true"]{ background: #ffffff; }

.infoblock{ border-left: 3px solid var(--line); padding: 4px 0 4px 16px; margin: 22px 0; }
#ceremonie .infoblock{ border-left-color: var(--c-ceremonie); }
#reception .infoblock{ border-left-color: var(--c-reception); }
.infoblock h3{ margin: 0 0 6px; font-size: 1.05rem; font-weight: normal; }
.infoblock p{ margin: 0; color: var(--muted); }
.registry-intro{ margin-bottom: 28px; }
.registry-grid{ display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 560px){ .registry-grid{ grid-template-columns: 1fr 1fr; } }
.item-card{ border: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; }
.item-card h3{ margin: 0 0 4px; font-weight: normal; font-size: 1.1rem; }
.item-price-line{ color: var(--muted); font-size: 0.92rem; margin-bottom: 10px; }
.progress-track{ height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.progress-fill{ height: 100%; background: var(--c-liste); width: 0%; transition: width 0.3s ease; }
.item-status{ font-size: 0.88rem; color: var(--muted); margin-bottom: 14px; }
.item-status strong{ color: var(--text); }
.contribute{ display: flex; gap: 8px; margin-top: auto; }
.contribute input{
  flex: 1; min-width: 0; font-family: inherit; font-size: 1rem; padding: 7px 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 2px;
}
.contribute button{
  font-family: inherit; font-size: 0.95rem; padding: 7px 14px; border: 1px solid var(--c-liste);
  background: var(--c-liste); color: var(--panel); cursor: pointer; border-radius: 2px; white-space: nowrap;
}
.contribute button:hover{ opacity: 0.9; }
.item-card.complete .contribute{ display: none; }
.item-card.complete .item-status{ color: var(--c-liste); }
.thankyou{ font-size: 0.88rem; color: var(--c-liste); margin-top: 8px; display: none; }
.item-card.complete .thankyou{ display: block; }
.error-msg{ font-size: 0.82rem; color: var(--danger); margin-top: 6px; display: none; }
.error-msg.show{ display: block; }
footer{ margin-top: 60px; padding-top: 20px; color: var(--muted); font-size: 0.9rem; text-align: center; }
@media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }
</style>
</head>

</div>

  { id: "item-1", name: { fr: "[Nom de l'article 1]", it: "[Nome dell'articolo 1]" }, price: 100, raised: 0, image: "images/item-1.jpg" },

/* ============================================================
   À partir d'ici : uniquement le fonctionnement du site.
   Rien à modifier en dessous de cette ligne.
   ============================================================ */
(function(){

  /* One frame, several photos: fades between them and shows dots
     when there is more than one image. Broken images fall back
     to a quiet placeholder inside their own slide. */
  function createCarousel(container, images, placeholderText, sizeClass){
    container.innerHTML = "";
    container.className = "carousel-frame" + (sizeClass ? " " + sizeClass : "");

    var list = (images && images.length) ? images : [];
    var slides = [];

    list.forEach(function(src, i){
      var slide = document.createElement("div");
      slide.className = "slide" + (i === 0 ? " active" : "");
      var img = document.createElement("img");
      img.src = src;
      img.alt = "";
      img.onerror = function(){
        slide.classList.add("placeholder");
        slide.textContent = placeholderText;
      };
      slide.appendChild(img);
      container.appendChild(slide);
      slides.push(slide);
    });

    if (slides.length > 1){
      var dots = document.createElement("div");
      dots.className = "carousel-dots";
      var current = 0;
      var dotButtons = [];

      function goTo(i){
        slides[current].classList.remove("active");
        dotButtons[current].setAttribute("aria-current", "false");
        current = i;
        slides[current].classList.add("active");
        dotButtons[current].setAttribute("aria-current", "true");
      }

      slides.forEach(function(_, i){
        var dot = document.createElement("button");
        dot.type = "button";
        dot.setAttribute("aria-label", "Photo " + (i + 1));
        dot.setAttribute("aria-current", i === 0 ? "true" : "false");
        dot.addEventListener("click", function(){ goTo(i); });
        dots.appendChild(dot);
        dotButtons.push(dot);
      });
      container.appendChild(dots);

      setInterval(function(){ goTo((current + 1) % slides.length); }, 4500);
    }
  }

  var TAB_NAMES = ["histoire", "ceremonie", "reception", "liste"];
  function setBodyBg(tabName){
    TAB_NAMES.forEach(function(name){ document.body.classList.remove("bg-" + name); });
    document.body.classList.add("bg-" + tabName);
  }

  function initTabs(){
    var tabs = document.querySelectorAll("nav button[role='tab']");
    var sections = document.querySelectorAll("main > section");
    tabs.forEach(function(tab){
      tab.addEventListener("click", function(){
        tabs.forEach(function(t){ t.setAttribute("aria-selected", "false"); });
        sections.forEach(function(s){ s.classList.remove("active"); });
        tab.setAttribute("aria-selected", "true");
        var tabName = tab.getAttribute("data-tab");
        document.getElementById(tabName).classList.add("active");
        setBodyBg(tabName);
      });
    });
    setBodyBg("histoire");
  }

  /* Contribution totals are stored as JSON inside the page itself
     (see #registry-state). Whoever contributes updates that JSON and
     re-publishes the page via the "artifact" capability, so the next
     person to open the link sees the new totals baked in — no separate
     database, no per-device storage. */
  var registryStateEl = document.getElementById("registry-state");
  function loadRegistryState(){
    try{
      var parsed = JSON.parse(registryStateEl.textContent || "{}");
      return (parsed && typeof parsed === "object") ? parsed : {};
    } catch(e){ return {}; }
  }
  function saveRegistryStateToDom(state){
    registryStateEl.textContent = JSON.stringify(state);
  }
  var registryState = loadRegistryState();
  SITE_ITEMS.forEach(function(it){
    if (typeof registryState[it.id] === "number") it.raised = registryState[it.id];
  });

  /* Resolves to the "artifact" capability namespace, or null if this
     view doesn't have it (capability not declared/granted, or the page
     is open somewhere other than a published Claude artifact). */
  var artifactCapPromise = (window.claude && typeof window.claude.use === "function")
    ? window.claude.use("artifact").catch(function(){ return null; })
    : Promise.resolve(null);

  var CHF = new Intl.NumberFormat("fr-CH", { maximumFractionDigits: 0 });

  function renderRegistry(lang){
    var s = SITE_CONTENT[lang].registry;
    var grid = document.getElementById("registry-grid");
    grid.innerHTML = "";

    SITE_ITEMS.forEach(function(it){
      var remaining = Math.max(0, it.price - it.raised);
      var pct = Math.min(100, Math.round((it.raised / it.price) * 100));
      var isComplete = remaining <= 0;

      var card = document.createElement("div");
      card.className = "item-card" + (isComplete ? " complete" : "");

      var photoDiv = document.createElement("div");
      var titleEl = document.createElement("h3");
      titleEl.textContent = it.name[lang];

      var priceLine = document.createElement("div");
      priceLine.className = "item-price-line";
      priceLine.textContent = s.goal + " : CHF " + CHF.format(it.price);

      var track = document.createElement("div");
      track.className = "progress-track";
      var fill = document.createElement("div");
      fill.className = "progress-fill";
      fill.style.width = pct + "%";
      track.appendChild(fill);

      var status = document.createElement("div");
      status.className = "item-status";
      status.innerHTML = isComplete
        ? "<strong>" + s.complete + "</strong>"
        : "<strong>CHF " + CHF.format(it.raised) + "</strong> " + s.raised + " — CHF " + CHF.format(remaining) + " " + s.remaining;

      var contribute = document.createElement("div");
      contribute.className = "contribute";
      var input = document.createElement("input");
      input.type = "number"; input.min = "1"; input.step = "1";
      input.placeholder = s.placeholder; input.setAttribute("aria-label", s.placeholder);
      var button = document.createElement("button");
      button.type = "button"; button.textContent = s.give;
      contribute.appendChild(input); contribute.appendChild(button);

      var errorEl = document.createElement("div");
      errorEl.className = "error-msg";
      var thanksEl = document.createElement("div");
      thanksEl.className = "thankyou"; thanksEl.textContent = s.thanks;

      card.appendChild(photoDiv); card.appendChild(titleEl); card.appendChild(priceLine);
      card.appendChild(track); card.appendChild(status); card.appendChild(contribute);
      card.appendChild(errorEl); card.appendChild(thanksEl);
      grid.appendChild(card);

      createCarousel(photoDiv, [it.image], s.photo, "square");

      function submit(){
        var sNow = SITE_CONTENT[document.documentElement.lang].registry;
        var val = parseFloat(input.value);
        if (!val || val <= 0 || isNaN(val)){
          errorEl.textContent = sNow.errInvalid; errorEl.classList.add("show"); return;
        }
        var remainingNow = it.price - it.raised;
        if (val > remainingNow + 0.0001){
          errorEl.textContent = sNow.errTooMuch; errorEl.classList.add("show"); return;
        }
        errorEl.classList.remove("show");
        it.raised = Math.min(it.price, it.raised + val);
        registryState[it.id] = it.raised;
        saveRegistryStateToDom(registryState);
        renderRegistry(document.documentElement.lang);

        button.disabled = true;
        artifactCapPromise.then(function(cap){
          if (!cap || typeof cap.publish !== "function") return;
          var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
          return cap.publish(html);
        }).catch(function(){
          /* Publish failed or wasn't available (e.g. a read-only viewer, or
             a transient error) — the contribution still shows on this
             device; it just didn't get saved for everyone. */
        }).then(function(){
          button.disabled = false;
        });
      }
      button.addEventListener("click", submit);
      input.addEventListener("keydown", function(e){ if (e.key === "Enter") submit(); });
    });
  }

  var LANG_KEY = "wedding-lang";
  function applyLang(lang){
    var c = SITE_CONTENT[lang];
    document.documentElement.lang = lang;

    document.getElementById("couple-names").textContent = c.coupleNames;
    document.getElementById("date-line").textContent = c.dateLine;
    document.querySelectorAll("nav button[data-nav]").forEach(function(btn){
      btn.textContent = c.nav[btn.getAttribute("data-nav")];
    });

    document.getElementById("histoire-title").textContent = c.histoire.title;
    var histoireText = document.getElementById("histoire-text");
    histoireText.innerHTML = "";
    c.histoire.paragraphs.forEach(function(p){
      var el = document.createElement("p"); el.textContent = p; histoireText.appendChild(el);
    });
    createCarousel(document.getElementById("histoire-photo"), c.histoire.photos, c.registry.photo, "wide");

    document.getElementById("ceremonie-title").textContent = c.ceremonie.title;
    document.getElementById("ceremonie-intro").textContent = c.ceremonie.intro;
    document.getElementById("ceremonie-heure-label").textContent = c.ceremonie.heure.label;
    document.getElementById("ceremonie-heure-value").textContent = c.ceremonie.heure.value;
    document.getElementById("ceremonie-lieu-label").textContent = c.ceremonie.lieu.label;
    document.getElementById("ceremonie-lieu-value").textContent = c.ceremonie.lieu.value;
    createCarousel(document.getElementById("ceremonie-photo"), c.ceremonie.photos, c.registry.photo, "wide");

    document.getElementById("reception-title").textContent = c.reception.title;
    document.getElementById("reception-intro").textContent = c.reception.intro;
    document.getElementById("reception-heure-label").textContent = c.reception.heure.label;
    document.getElementById("reception-heure-value").textContent = c.reception.heure.value;
    document.getElementById("reception-lieu-label").textContent = c.reception.lieu.label;
    document.getElementById("reception-lieu-value").textContent = c.reception.lieu.value;
    document.getElementById("reception-programme-label").textContent = c.reception.programme.label;
    document.getElementById("reception-programme-value").textContent = c.reception.programme.value;
    createCarousel(document.getElementById("reception-photo"), c.reception.photos, c.registry.photo, "wide");

    document.getElementById("registry-title").textContent = c.registry.title;
    document.getElementById("registry-intro").textContent = c.registry.intro;
    document.getElementById("site-footer").textContent = c.footer;

    document.querySelectorAll(".lang-switch button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    try { localStorage.setItem(LANG_KEY, lang); } catch(e){}

    renderRegistry(lang);
  }

  document.addEventListener("DOMContentLoaded", function(){
    initTabs();
    document.querySelectorAll(".lang-switch button").forEach(function(btn){
      btn.addEventListener("click", function(){ applyLang(btn.getAttribute("data-lang")); });
    });
    var savedLang = null;
    try { savedLang = localStorage.getItem(LANG_KEY); } catch(e){}
    applyLang(savedLang === "it" ? "it" : "fr");
  });

})();
</script>
</body>
</html>
